services:
  cypress-test:
    container_name: cypress-test
    profiles: ['', 'tests']
    # `image` lets CI pull a pre-built, publicly published runner instead of rebuilding
    # per shard (see build-cypress-runner-image in docker-build.yml); `build` is kept so
    # local `docker compose ... build` / `up --build` still works without GHCR access.
    image: ghcr.io/eclipse-mnestix/mnestix-browser/cypress-runner:${CYPRESS_RUNNER_TAG:-local}
    build:
      dockerfile: cypress.dockerfile
    environment:
      CYPRESS_BASE_URL: 'http://mnestix-browser:3000'
      CYPRESS_AAS_REPO_API_URL: 'http://mnestix-proxy:5065/repo'
      CYPRESS_SUBMODEL_REPO_API_URL: 'http://mnestix-proxy:5065/repo'
      CYPRESS_MNESTIX_AAS_GENERATOR_API_URL: 'http://mnestix-proxy:5065'
      CYPRESS_AAS_DISCOVERY_API_URL: 'http://mnestix-proxy:5065/discovery'
      # cypress.config.ts defaults to localhost for host-run dev usage; inside this
      # container network the in-network hostnames/secret used by the mnestix-browser
      # service below must be used instead so createKeycloakSession() mints a session
      # that mnestix-browser can actually decrypt.
      CYPRESS_KEYCLOAK_ISSUER: 'http://keycloak:8080'
      CYPRESS_KEYCLOAK_REALM: 'Mnestix'
      CYPRESS_KEYCLOAK_CLIENT_ID: 'mnestix-browser-client-demo'
      CYPRESS_NEXTAUTH_SECRET: 'test'
      MNESTIX_API_KEY: 'verySecureApiKey'
      ELECTRON_ENABLE_LOGGING: 1
      SPLIT: ${SPLIT:-1}
      SPLIT_INDEX: ${SPLIT_INDEX:-0}
    command: run
    volumes:
      - ./cypress/:/cypress_Tests/cypress
      - ./cypress.config.ts:/cypress_Tests/cypress.config.ts
      - ./cypress-artifacts/screenshots:/cypress_Tests/cypress/screenshots
      - ./cypress-artifacts/videos:/cypress_Tests/cypress/videos
      # esm compatibility
      - ./tsconfig.json:/cypress_Tests/tsconfig.json
    depends_on:
      mnestix-browser:
        condition: service_started
      mnestix-aas-generator:
        condition: service_started
      aas-environment:
        condition: service_healthy
      keycloak:
        condition: service_healthy # keycloak needs to be healthy before tests
    networks:
      - mnestix-network

  # Runs the frozen pre-overhaul suite (cypress/legacy) against the exact same stack
  # as cypress-test, purely so the two can be compared side by side while the new
  # suite is being trusted. Not part of the 'tests' profile's pass/fail gate - start
  # it explicitly (`--profile legacy-tests`) when a comparison run is wanted, and
  # remove this service once the new suite has fully replaced it.
  cypress-test-legacy:
    container_name: cypress-test-legacy
    profiles: ['legacy-tests']
    image: ghcr.io/eclipse-mnestix/mnestix-browser/cypress-runner:${CYPRESS_RUNNER_TAG:-local}
    build:
      dockerfile: cypress.dockerfile
    environment:
      CYPRESS_BASE_URL: 'http://mnestix-browser:3000'
      CYPRESS_AAS_REPO_API_URL: 'http://mnestix-proxy:5065/repo'
      CYPRESS_SUBMODEL_REPO_API_URL: 'http://mnestix-proxy:5065/repo'
      CYPRESS_MNESTIX_AAS_GENERATOR_API_URL: 'http://mnestix-proxy:5065'
      CYPRESS_AAS_DISCOVERY_API_URL: 'http://mnestix-proxy:5065/discovery'
      MNESTIX_API_KEY: 'verySecureApiKey'
      ELECTRON_ENABLE_LOGGING: 1
    command: ['run', '--config-file', 'cypress.legacy.config.ts']
    volumes:
      - ./cypress/:/cypress_Tests/cypress
      - ./cypress.legacy.config.ts:/cypress_Tests/cypress.legacy.config.ts
      - ./cypress-artifacts/screenshots:/cypress_Tests/cypress/screenshots
      - ./cypress-artifacts/videos:/cypress_Tests/cypress/videos
      - ./tsconfig.json:/cypress_Tests/tsconfig.json
    depends_on:
      mnestix-browser:
        condition: service_started
      mnestix-aas-generator:
        condition: service_started
      aas-environment:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - mnestix-network

  mnestix-browser:
    image: mnestix/mnestix-browser:latest
    environment:
      AAS_REPO_API_URL: 'http://mnestix-proxy:5065/repo'
      SUBMODEL_REPO_API_URL: 'http://mnestix-proxy:5065/repo'
      DISCOVERY_API_URL: 'http://mnestix-proxy:5065/discovery'
      MNESTIX_AAS_GENERATOR_API_URL: 'http://mnestix-proxy:5065'
      AUTHENTICATION_FEATURE_FLAG: 'true'
      NEXTAUTH_URL: 'http://mnestix-browser:3000/'
      KEYCLOAK_ENABLED: 'true'
      KEYCLOAK_CLIENT_ID: 'mnestix-browser-client-demo'
      KEYCLOAK_ISSUER: 'http://keycloak:8080'
      KEYCLOAK_LOCAL_URL: 'http://keycloak:8080'
      KEYCLOAK_REALM: 'Mnestix'
      NEXTAUTH_SECRET: 'test'

  mnestix-proxy:
    environment:
      OpenId__EnableOpenIdAuth: 'true'
      OpenId__Issuer: 'http://keycloak:8080/realms/Mnestix'
      OpenId__ClientID: 'mnestixApi-demo'
      OpenId__RequireHttpsMetadata: 'false'

  mnestix-aas-generator:
    environment:
      Features__UseAuthentication: 'true'
      # OpenID Configuration
      OpenId__EnableOpenIdAuth: 'true'
      OpenId__Issuer: 'http://keycloak:8080/realms/Mnestix'
      OpenId__ClientID: 'mnestixApi-demo'
      OpenId__RequireHttpsMetadata: 'false'
    depends_on:
      keycloak:
        condition: service_healthy # keycloak needs to be healthy before starting the generator

  keycloak:
    profiles: ['', 'tests']
    image: keycloak/keycloak:26.6.3
    container_name: keycloak
    volumes:
      - ./docker-compose/data/keycloak/realm/Mnestix-realm.json:/opt/keycloak/data/import/realm-config.json
    ports:
      - 8080:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # hostname v2: containers (and the in-network Cypress runner) reach Keycloak at this canonical URL.
      KC_HOSTNAME: http://keycloak:8080
      KC_HEALTH_ENABLED: 'true'
    command: ['start-dev', '--import-realm']
    healthcheck:
      test: #keycloak has no curl in image; health moved to the 9000 management port in KC 25+
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 30s
      timeout: 5s
      retries: 20

    networks:
      - mnestix-network
