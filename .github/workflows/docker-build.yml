name: CI and Docker Deploy

on:
  push:
    branches: ["main", "dev", "maintenance/*"]
    tags: ["v*.*.*"]
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/copilot-instructions.md"
      - "wiki/**"
      - "README.md"
  pull_request:
    branches: ["dev", "maintenance/*"]
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/copilot-instructions.md"
      - "wiki/**"
      - "README.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # github.repository as <account>/<repo>
  IMAGE_NAME: mnestix-browser
  # Update the version manually
  IMAGE_TAG_VERSION: 2.2.2

jobs:
  build-browser-image:
    name: Build browser image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          context: "."
          cache-from: mnestix/mnestix-browser:dev
          cache-to: type=local,dest=/tmp/buildx-amd64-cache,mode=max
          target: production
          push: false
          tags: mnestix/mnestix-browser:latest
          load: true

      - name: Cache buildx
        uses: actions/cache/save@v6
        with:
          path: |
            /tmp/buildx-amd64-cache
          key: buildx-amd64-${{github.ref}}-${{ github.run_id }}
          enableCrossOsArchive: true

      - name: Save mnestix-browser image
        run: docker save mnestix/mnestix-browser:latest -o mnestix-browser.tar

      - name: Cache image
        uses: actions/cache/save@v6
        with:
          path: mnestix-browser.tar
          key: docker-image-${{github.ref}}-${{ github.run_id }}

  build-cypress-runner-image:
    name: Build or reuse Cypress runner image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute image tag from Dockerfile + lockfile hash
        id: tag
        run: echo "tag=${{ hashFiles('cypress.dockerfile', 'yarn.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if this exact runner image is already published
        id: check
        run: |
          if docker manifest inspect "ghcr.io/${{ github.repository }}/cypress-runner:${{ steps.tag.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build and publish Cypress runner image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: "."
          file: cypress.dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/cypress-runner:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}/cypress-runner:latest

  e2e-tests:
    name: e2e test matrix
    runs-on: ubuntu-latest
    needs: ["build-browser-image", "build-cypress-runner-image"]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # add more containers to run more tests in parallel
        containers: [1, 2, 3, 4]
    env:
      CYPRESS_RUNNER_TAG: ${{ needs.build-cypress-runner-image.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore image
        uses: actions/cache/restore@v6
        with:
          path: mnestix-browser.tar
          key: docker-image-${{github.ref}}-${{ github.run_id }}

      - name: Pull images
        run: docker compose -f compose.yml -f docker-compose/compose.test.yml --profile tests pull

      # Remove old image to avoid conflicts, before sometimes the old image wasn't loaded
      # If this step fails please check docker-compose/compose.test.yml if tag is still correct
      - name: Remove Docker image mnestix/mnestix-browser:latest, to avoid conflicts
        run: docker rmi mnestix/mnestix-browser:latest

      # overwrite the pulled image with the new image
      - name: Load mnestix-browser image
        run: docker load -i mnestix-browser.tar

      - name: Run e2e tests
        # 18-minute timeout to speed up failing tests that are retried too long.
        # If the timeout is reached under normal test conditions, consider increasing
        # the number of containers to run more tests in parallel.
        timeout-minutes: 18
        run: |
          docker compose -f compose.yml -f docker-compose/compose.test.yml --profile tests up -d &&
          docker compose -f compose.yml -f docker-compose/compose.test.yml attach cypress-test
        env:
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}
          TEST_ADMIN_USER_PASSWORD: ${{ secrets.TEST_ADMIN_USER_PASSWORD }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: E2E test collect artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-artifacts-${{ matrix.containers }}
          path: cypress-artifacts/

  mobile-smoke:
    name: Mobile smoke tests
    runs-on: ubuntu-latest
    needs: ["build-browser-image", "build-cypress-runner-image"]
    permissions:
      contents: read
    env:
      CYPRESS_RUNNER_TAG: ${{ needs.build-cypress-runner-image.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore image
        uses: actions/cache/restore@v6
        with:
          path: mnestix-browser.tar
          key: docker-image-${{github.ref}}-${{ github.run_id }}

      - name: Pull images
        run: docker compose -f compose.yml -f docker-compose/compose.test.yml --profile tests pull

      - name: Remove Docker image mnestix/mnestix-browser:latest, to avoid conflicts
        run: docker rmi mnestix/mnestix-browser:latest

      - name: Load mnestix-browser image
        run: docker load -i mnestix-browser.tar

      - name: Run mobile-tagged e2e tests
        timeout-minutes: 18
        run: |
          docker compose -f compose.yml -f docker-compose/compose.test.yml --profile tests up -d &&
          docker compose -f compose.yml -f docker-compose/compose.test.yml attach cypress-test
        env:
          CYPRESS_grepTags: "@mobile"
          TEST_ADMIN_USER_PASSWORD: ${{ secrets.TEST_ADMIN_USER_PASSWORD }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Mobile smoke collect artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-artifacts-mobile-smoke
          path: cypress-artifacts/

  # Runs the frozen pre-overhaul suite side by side with the new suite so the two can
  # be compared while confidence is being built in the new suite. Intentionally
  # non-blocking (continue-on-error) - remove this job once the new suite has fully
  # replaced cypress/legacy.
  e2e-tests-legacy:
    name: e2e test matrix (legacy, non-blocking)
    runs-on: ubuntu-latest
    needs: ["build-browser-image", "build-cypress-runner-image"]
    permissions:
      contents: read
    continue-on-error: true
    env:
      CYPRESS_RUNNER_TAG: ${{ needs.build-cypress-runner-image.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore image
        uses: actions/cache/restore@v6
        with:
          path: mnestix-browser.tar
          key: docker-image-${{github.ref}}-${{ github.run_id }}

      - name: Pull images
        run: docker compose -f compose.yml -f docker-compose/compose.test.yml --profile legacy-tests pull

      - name: Remove Docker image mnestix/mnestix-browser:latest, to avoid conflicts
        run: docker rmi mnestix/mnestix-browser:latest

      - name: Load mnestix-browser image
        run: docker load -i mnestix-browser.tar

      - name: Run legacy e2e tests
        timeout-minutes: 30
        run: |
          docker compose -f compose.yml -f docker-compose/compose.test.yml --profile legacy-tests up -d &&
          docker compose -f compose.yml -f docker-compose/compose.test.yml attach cypress-test-legacy
        env:
          TEST_ADMIN_USER_PASSWORD: ${{ secrets.TEST_ADMIN_USER_PASSWORD }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Legacy e2e test collect artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-artifacts-legacy
          path: cypress-artifacts/

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        run: yarn prisma:generate

      - name: Run unit tests
        run: npx jest

  lint:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        run: yarn prisma:generate

      - name: Typescript check
        run: yarn typecheck
      - name: Typescript e2e check
        run: yarn typecheck:e2e
      - name: Linting check
        run: yarn lint

  # Target for PR Merge Check
  ci-success:
    name: Successful build and tests
    runs-on: ubuntu-latest
    needs: ["lint", "unit-test", "e2e-tests"]
    permissions:
      contents: read
    steps:
      - name: Success
        run: echo "Success"

  # It takes 22 minutes to build the arm64 image in amd64-QEMU so we build a cache on the arm64 runner
  # Github Issues point to a yarn problem
  # https://github.com/docker/build-push-action/issues/471
  # https://github.com/nodejs/docker-node/issues/1335
  build-arm-cache:
    name: Build arm image cache
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/arm64
          context: "."
          cache-to: type=local,dest=/tmp/buildx-arm64-cache,mode=max
          target: production
          push: false

      - name: Cache buildx
        uses: actions/cache/save@v6
        with:
          path: |
            /tmp/buildx-arm64-cache
          key: buildx-arm64-${{github.ref}}-${{ github.run_id }}
          enableCrossOsArchive: true

  push-image:
    name: Push image to registry
    needs: ["ci-success", "build-arm-cache"]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' &&
      github.repository_owner == 'eclipse-mnestix' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/maintenance/'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Restore amd64 cache
        uses: actions/cache/restore@v6
        with:
          path: |
            /tmp/buildx-amd64-cache
          key: buildx-amd64-${{github.ref}}-${{ github.run_id }}
          # can be build without cache
          fail-on-cache-miss: false
      - name: Restore arm64 cache
        uses: actions/cache/restore@v6
        with:
          path: |
            /tmp/buildx-arm64-cache
          key: buildx-arm64-${{github.ref}}-${{ github.run_id }}
          # building takes ages
          fail-on-cache-miss: true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_API_TOKEN }}

      - name: Extract branch name
        id: extract_branch
        run: |
          branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          echo "branch=${branch}" >> $GITHUB_OUTPUT
          tag=${branch//\//_}  # This uses shell parameter substitution to replace "/" with "_"
          echo "tag=${tag}" >> $GITHUB_OUTPUT

      - name: Build and push docker images
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: "."
          cache-from: |
            type=local,src=/tmp/buildx-arm64-cache
            type=local,src=/tmp/buildx-amd64-cache
          target: production
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('mnestix/{0}:{1}', env.IMAGE_NAME, env.IMAGE_TAG_VERSION) || '' }}
            ${{ github.ref == 'refs/heads/main' && format('mnestix/{0}:latest', env.IMAGE_NAME) || '' }}
            ${{ github.ref != 'refs/heads/main' && format('mnestix/{0}:{1}', env.IMAGE_NAME, steps.extract_branch.outputs.tag) || '' }}
